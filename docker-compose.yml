version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: tim-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tim
      POSTGRES_PASSWORD: tim_secret
      POSTGRES_DB: tim_bim
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tim -d tim_bim']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: tim-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      DATABASE_URL: postgresql://tim:tim_secret@postgres:5432/tim_bim
      API_PORT: 3001
      API_HOST: 0.0.0.0
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: tim-web
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:3001
    depends_on:
      - api

volumes:
  postgres_data:
